[project]
name = "micrograd"
version = "0.1.0"
description = "An annotated walk through reverse-mode autodiff, from the derivative to a MLP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "graphviz>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "micrograd-rs",
    "nbstripout>=0.8",
    "numpy>=2.5.4",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "torch>=2.15.0",
]

[tool.uv.workspace]
members = [
    "micrograd-rs",
]

[tool.uv.sources]
micrograd-rs = { workspace = true }
